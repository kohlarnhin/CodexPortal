name: Package Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-support-0.2.3]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate portable update helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'src-tauri/src/updates/portable-update.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Build and upload portable executable
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target x86_64-pc-windows-msvc --no-bundle
          uploadPlainBinary: true
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
