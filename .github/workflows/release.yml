name: Release Codex Portal

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown in the app and on GitHub
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-portal-release
  cancel-in-progress: false

jobs:
  build-macos:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and sign updater bundle
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Codex Portal v__VERSION__
          releaseBody: ${{ inputs.release_notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          args: --target ${{ matrix.target }}

      - name: Create DMG installer
        id: dmg
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codex Portal.app"
          DMG_PATH="${RUNNER_TEMP}/CodexPortal_${{ steps.tauri.outputs.appVersion }}_${{ matrix.arch }}.dmg"
          STAGING_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGING_DIR"' EXIT

          test -d "$APP_PATH"
          cp -a "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Codex Portal" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_PATH"

          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload DMG installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "${{ steps.dmg.outputs.path }}" --clobber

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: node -e "const fs = require('fs'); const pkg = require('./package.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + pkg.version + '\n')"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.value }}" --draft=false --latest
