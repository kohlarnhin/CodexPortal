<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 恢复到 macOS 官方规范尺寸：边长约 824px，留出 10% 的标准内边距 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#shadow)"/>
  <text x="512" y="685" font-family="SF Pro Display, Inter, sans-serif" font-size="480" font-weight="700" fill="white" text-anchor="middle">C</text>
</svg>
